<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ping Pong</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="app">
    <header class="header">
      <h1>Ping Pong</h1>
      <p class="subtitle">Elige un modo de juego para comenzar</p>
    </header>

    <section id="menu" class="menu">
      <button id="btn-cpu" class="btn btn-primary" type="button">
        1 Jugador vs CPU
      </button>
      <button id="btn-multiplayer" class="btn btn-secondary" type="button">
        2 Jugadores
      </button>
    </section>

    <section id="game-container" class="game-container hidden">
      <div class="hud">
        <span id="mode-label" class="mode-label"></span>
        <span id="score" class="score">0 — 0</span>
      </div>

      <canvas id="game-canvas" width="800" height="500" aria-label="Campo de juego de ping pong"></canvas>

      <div class="controls-info">
        <p><strong>Jugador 1:</strong> W / S</p>
        <p id="player2-controls"><strong>Jugador 2:</strong> ↑ / ↓</p>
        <p><strong>Reiniciar:</strong> R &nbsp;|&nbsp; <strong>Menú:</strong> Esc</p>
      </div>

      <button id="btn-back" class="btn btn-ghost" type="button">Volver al menú</button>
    </section>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-content">
        <h2 id="overlay-title">Pausa</h2>
        <p id="overlay-message"></p>
      </div>
    </div>
  </main>

  <script type="module" src="js/main.js"></script>
</body>
</html>
